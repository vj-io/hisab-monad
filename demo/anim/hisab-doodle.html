<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Patrick+Hand&display=block" rel="stylesheet">
<style>
  :root { --ink:#0a0a0a; --paper:#f0ede8; --muted:#6f6c66; --accent:#c8ff00; --red:#c4291c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--paper); color:var(--ink); }
  #stage { position:absolute; inset:0; overflow:hidden; background:var(--paper); }
  #cam { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #gridw { position:absolute; left:-300px; top:-300px; width:6800px; height:4100px;
    background-image: linear-gradient(rgba(10,10,10,.07) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(10,10,10,.07) 1.5px, transparent 1.5px);
    background-size: 60px 60px; background-position: 0 0; }
  #grain { position:absolute; inset:0; opacity:.35; mix-blend-mode:multiply; pointer-events:none; z-index:50; }
  .panel { position:absolute; width:1920px; height:1080px; }
  .panel svg.ink { position:absolute; left:0; top:0; overflow:visible; }
  .panel svg.ink path { fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; }
  .t { position:absolute; will-change:clip-path, transform, opacity; white-space:nowrap; }
  .hand { font-family:'Patrick Hand', cursive; }
  .disp { font-family:'Archivo', sans-serif; font-weight:800; letter-spacing:-.04em; line-height:.95; }
  .body { font-family:'Archivo', sans-serif; font-weight:500; letter-spacing:-.01em; line-height:1.2; }
  .mono { font-family:'JetBrains Mono', monospace; }
  .btnl { display:flex; align-items:center; justify-content:center; font-family:'Archivo',sans-serif; font-weight:800; letter-spacing:-.02em; }
  .chip { background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-weight:500; letter-spacing:.02em; }
  .chip b { color:var(--accent); font-weight:700; }
  .stamp { border:9px solid var(--ink); padding:4px 26px 8px; font-family:'Archivo',sans-serif; font-weight:800; letter-spacing:.03em; background:rgba(240,237,232,.55); mix-blend-mode:multiply; transform-origin:center; }
  .coin { position:absolute; width:46px; height:46px; border-radius:50%; background:var(--accent); border:5px solid var(--ink); font:700 22px 'JetBrains Mono',monospace; display:flex; align-items:center; justify-content:center; will-change:transform; }
  .handle { position:absolute; width:48px; height:48px; border-radius:50%; background:var(--accent); border:6px solid var(--ink); will-change:left; }
  #cursor { position:absolute; left:0; top:0; width:60px; height:70px; z-index:30; pointer-events:none; overflow:visible; }
  #pencil { position:absolute; left:0; top:0; width:100px; height:100px; z-index:29; pointer-events:none; overflow:visible; }
  .ripple { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border:6px solid var(--ink); border-radius:50%; z-index:28; pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><div id="gridw"></div></div>
  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .18 0"/></filter><rect width="1920" height="1080" filter="url(#n)"/></svg>
  <svg width="0" height="0" style="position:absolute">
    <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
</div>
<script src="tl.js"></script>
<script>
// ------------------------------------------------------------------ utils (lifted from the doodle engine)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : 1 - Math.exp(-x * 8) * Math.cos(x * 20);
let _s = 20261013; const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
const J = a => (rnd() - .5) * 2 * a;
const f1 = v => v.toFixed(1);
const P = (x, y) => `${f1(x)} ${f1(y)}`;
const SFX = [];
const LIME = '#c8ff00', INK = '#0a0a0a', RED = '#c4291c', CARD = '#f8f6f1';
const fmt = (n, d = 2) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const lerp = (a, b, p) => a + (b - a) * p;

function line(x1, y1, x2, y2, b = 5) {
  const mx = (x1 + x2) / 2 + J(b), my = (y1 + y2) / 2 + J(b);
  return `M${P(x1 + J(2), y1 + J(2))} Q${P(mx, my)} ${P(x2 + J(2), y2 + J(2))}`;
}
function rectP(x, y, w, h, o = 9) {
  return [line(x - o*rnd(), y, x + w + o*rnd(), y), line(x + w, y - o*rnd(), x + w, y + h + o*rnd()),
          line(x + w + o*rnd(), y + h, x - o*rnd(), y + h), line(x, y + h + o*rnd(), x, y - o*rnd())].join(' ');
}
function circleP(cx, cy, r, turn = 1.1, a0 = -2.2) {
  const n = 56; let d = '';
  for (let i = 0; i <= n; i++) {
    const a = a0 + (i / n) * Math.PI * 2 * turn, rr = r * (1 + J(.025) + (i / n) * .05);
    d += (i ? ' L' : 'M') + P(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  return d;
}
function arcP(cx, cy, r, a1, a2) {
  let d = ''; const n = 24;
  for (let i = 0; i <= n; i++) { const a = a1 + (a2 - a1) * i / n; d += (i ? ' L' : 'M') + P(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  return d;
}
function arrowP(x1, y1, x2, y2, bend = 40, head = 26) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  const cx = mx - dy / L * bend, cy = my + dx / L * bend;
  const a = Math.atan2(y2 - cy, x2 - cx);
  return `M${P(x1, y1)} Q${P(cx, cy)} ${P(x2, y2)} M${P(x2 - Math.cos(a - .5) * head, y2 - Math.sin(a - .5) * head)} L${P(x2, y2)} L${P(x2 - Math.cos(a + .5) * head, y2 - Math.sin(a + .5) * head)}`;
}
const checkP = (x, y, s) => `M${P(x, y + s*.5)} L${P(x + s*.35, y + s*.88)} L${P(x + s, y)}`;
const crossP = (x, y, s) => `${line(x, y, x + s, y + s, 3)} ${line(x + s, y, x, y + s, 3)}`;
function sparkP(x, y, s) {
  return [0, 1, 2, 3].map(k => { const a = k * Math.PI / 2 + .3; return line(x + Math.cos(a) * s * .35, y + Math.sin(a) * s * .35, x + Math.cos(a) * s, y + Math.sin(a) * s, 1); }).join(' ');
}
function squigP(x, y, w, amp = 26) { // a signature scrawl
  let d = `M${P(x, y)}`; const n = 9;
  for (let i = 1; i <= n; i++) d += ` Q${P(x + w * (i - .5) / n, y + (i % 2 ? -amp : amp) * (1 - i / (n + 3)) + J(6))} ${P(x + w * i / n, y + J(5))}`;
  return d + ` L${P(x + w + 10, y + 12)}`;
}
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
const press = x => x < 0 ? 0 : x < .1 ? x / .1 : Math.max(0, 1 - (x - .1) / .25);

// ------------------------------------------------------------------ timeline from the voice
const NT = []; { let t = 0.4; for (let i = 0; i < DUR.length; i++) { NT[i] = t; t += DUR[i] + 0.28; } }
const END_T = NT[10] + DUR[10] + 2.4;
const T = (i, ph, off = 0) => { const k = LINES[i].indexOf(ph); if (k < 0) throw new Error('phrase not found: ' + ph); return NT[i] + DUR[i] * (k / LINES[i].length) + off; };

// ------------------------------------------------------------------ panels
const cam = document.getElementById('cam');
const panels = [], PEN = [], CUR = [], MOVES = [];
class Panel {
  constructor(px, py) {
    Object.assign(this, { px, py, tracks: [], hooks: [] });
    this.el = document.createElement('div'); this.el.className = 'panel';
    this.el.style.left = px + 'px'; this.el.style.top = py + 'px';
    this.svg = svgEl('svg', { class: 'ink', width: 1920, height: 1080 });
    this.fills = svgEl('g'); this.g = svgEl('g', { filter: 'url(#boil)' });
    this.svg.append(this.fills, this.g); this.el.append(this.svg); cam.append(this.el); panels.push(this);
  }
  path(d, at, dur = .5, o = {}) {
    const p = svgEl('path', { d, pathLength: 1 });
    p.style.strokeWidth = o.w || 5; if (o.color) p.style.stroke = o.color;
    p.style.strokeDasharray = '1 1'; (o.parent || this.g).append(p);
    this.tracks.push({ kind: 'draw', el: p, at, dur, out: o.out });
    if (dur >= .35 && !o.quiet) SFX.push({ t: at, type: 'scribble', x: dur });
    if (o.pen) PEN.push({ el: p, at, dur, pan: this });
    return p;
  }
  block(x, y, w, h, at, o = {}) {
    const r = svgEl('rect', { x, y, width: w, height: h, rx: o.rx ?? 4 });
    r.style.fill = o.color || LIME; r.style.transformBox = 'fill-box'; r.style.transformOrigin = o.origin || 'left center';
    (o.top ? this.g : this.fills).append(r);
    this.tracks.push({ kind: o.kind || 'grow', el: r, at, dur: o.dur || .35, out: o.out });
    return r;
  }
  text(x, y, html, cls, at, o = {}) {
    const d = document.createElement('div'); d.className = 't ' + cls; d.innerHTML = html;
    Object.assign(d.style, { left: x + 'px', top: y + 'px' }, o.style || {});
    if (o.w) d.style.width = o.w + 'px';
    if (o.h) d.style.height = o.h + 'px';
    if (o.rot) d.dataset.rot = o.rot;
    this.el.append(d);
    const anim = o.anim || 'write';
    const dur = o.dur || (anim === 'write' ? Math.max(.4, d.textContent.length * .028) : .4);
    this.tracks.push({ kind: anim, el: d, at, dur, out: o.out });
    if (anim === 'pop') SFX.push({ t: at, type: 'pop' });
    if (anim === 'stamp') SFX.push({ t: at + .1, type: 'stamp' });
    return d;
  }
  // text that changes with time. fn(t) -> html
  live(x, y, cls, style, at, fn, o = {}) {
    const d = this.text(x, y, '', cls, at, { anim: o.anim || 'fade', style, w: o.w, dur: .3, out: o.out });
    this.hooks.push(t => { if (t >= at) d.innerHTML = fn(t); }); return d;
  }
  on(fn) { this.hooks.push(fn); }
  card(x, y, w, h, at, o = {}) {
    this.block(x, y, w, h, at, { color: CARD, kind: 'op', dur: .3, rx: 6 });
    return this.path(rectP(x, y, w, h, 8), at, o.dur || .6, { w: 6, pen: o.pen });
  }
  button(x, y, w, h, label, at, o = {}) {
    const kind = o.kind || 'primary', col = kind === 'danger' ? RED : INK;
    const gb = svgEl('g'); this.g.append(gb);
    const fill = svgEl('rect', { x, y, width: w, height: h, rx: 8 });
    fill.style.fill = kind === 'primary' ? LIME : CARD; fill.style.stroke = 'none'; gb.append(fill);
    this.tracks.push({ kind: 'op', el: fill, at: at + .2, dur: .25 });
    this.path(rectP(x, y, w, h, 7), at, .45, { parent: gb, color: col, w: 6 });
    const lab = this.text(x, y, label, 'btnl', at + .25, { anim: 'op', w, h, style: { fontSize: (o.fs || 38) + 'px', color: col } });
    const cx = x + w / 2, cy = y + h / 2;
    if (o.click != null) {
      SFX.push({ t: o.click, type: 'click' });
      this.hooks.push(u => { const d = press(u - o.click);
        gb.setAttribute('transform', `translate(${cx} ${cy + 3*d}) scale(${1 - .05*d}) translate(${-cx} ${-cy})`);
        lab.style.transform = `translateY(${3*d}px) scale(${1 - .05*d})`; });
    }
    return { x, y, w, h, cx, cy };
  }
  slider(x, y, w, at, t0, t1) {
    this.path(line(x, y, x + w, y, 3), at, .4, { w: 7 });
    const fl = this.block(x, y - 9, 1, 18, at + .2, { kind: 'op', dur: .1 });
    const hd = document.createElement('div'); hd.className = 'handle'; this.el.append(hd);
    this.tracks.push({ kind: 'popb', el: hd, at: at + .3, dur: .3, plain: 1 });
    const v = t => eio(seg(t, t0, t1));
    this.hooks.push(t => { if (t < at + .3) return; hd.style.left = (x + w * v(t) - 24) + 'px'; hd.style.top = (y - 24) + 'px'; fl.setAttribute('width', Math.max(1, w * v(t))); });
    return v;
  }
  bar(x, y, w, h, at, t0, t1) {
    this.path(rectP(x, y, w, h, 5), at, .4, { w: 5 });
    const f = this.block(x + 4, y + 4, 1, h - 8, at + .2, { kind: 'op', dur: .1 });
    this.hooks.push(t => f.setAttribute('width', Math.max(1, (w - 8) * eio(seg(t, t0, t1)))));
    SFX.push({ t: t0, type: 'scribble', x: t1 - t0 });
  }
  stamp(x, y, txt, at, o = {}) {
    return this.text(x, y, txt, 'stamp', at, { anim: 'stamp', rot: o.rot ?? -6, style: Object.assign({ fontSize: (o.fs || 76) + 'px', color: o.color || INK, borderColor: o.color || INK }, o.style || {}) });
  }
  checkBadge(cx, cy, r, at) {
    this.block(cx - r, cy - r, 2 * r, 2 * r, at, { rx: r, kind: 'popb', origin: 'center' });
    this.path(circleP(cx, cy, r, 1.05), at, .3, { w: 5, quiet: 1 });
    this.path(checkP(cx - r * .45, cy - r * .35, r * .95), at + .12, .25, { w: 9, quiet: 1 });
    SFX.push({ t: at + .1, type: 'success', x: 3 });
  }
  fly(html, p0, c, p1, t0, dur, o = {}) {
    const d = document.createElement('div'); d.className = o.cls || 'coin'; d.innerHTML = html;
    if (o.style) Object.assign(d.style, o.style); this.el.append(d);
    this.hooks.push(t => {
      const p = seg(t, t0, t0 + dur), e = eio(p), q = 1 - e;
      const x = q*q*p0[0] + 2*q*e*c[0] + e*e*p1[0], y = q*q*p0[1] + 2*q*e*c[1] + e*e*p1[1];
      const vis = t >= t0 && (o.stay || t <= t0 + dur + .05);
      d.style.opacity = vis ? 1 : 0; d.style.left = x + 'px'; d.style.top = y + 'px';
    });
    return d;
  }
  update(u) {
    for (const k of this.tracks) {
      const p = seg(u, k.at, k.at + k.dur), s = k.el.style, rot = +(k.el.dataset.rot || 0);
      const fo = k.out ? 1 - seg(u, k.out[0], k.out[1]) : 1;
      switch (k.kind) {
        case 'draw': s.strokeDashoffset = 1 - eo(p); s.opacity = (p > 0 ? 1 : 0) * fo; break;
        case 'grow': s.transform = `scaleX(${eo(p)})`; s.opacity = fo; break;
        case 'growY': s.transform = `scaleY(${eo(p)})`; s.opacity = fo; break;
        case 'op': s.opacity = p * fo; break;
        case 'write': s.clipPath = `inset(-30% ${f1((1 - p) * 100)}% -30% -2%)`; s.opacity = (p > 0 ? 1 : 0) * fo; s.transform = rot ? `rotate(${rot}deg)` : ''; break;
        case 'fade': s.opacity = p * fo; s.transform = `translateY(${f1((1 - eo(p)) * 24)}px) rotate(${rot}deg)`; break;
        case 'pop': { const x = u - k.at; const sc = x <= 0 ? 0 : spring(x * 1.1); s.opacity = (x > 0 ? 1 : 0) * fo; s.transform = `scale(${sc.toFixed(3)}) rotate(${rot}deg)`; break; }
        case 'popb': { const x = u - k.at; const sc = x <= 0 ? 0 : spring(x * 1.1); s.transform = `scale(${sc.toFixed(3)})`; s.transformOrigin = 'center'; if (k.plain) s.opacity = x > 0 ? 1 : 0; else s.opacity = fo; break; }
        case 'stamp': { const x = u - k.at; const q = clamp(x / .16); s.opacity = (x > 0 ? 1 : 0) * fo; s.transform = `scale(${(2.4 - 1.4 * eo(q)).toFixed(3)}) rotate(${rot}deg)`; break; }
      }
    }
    for (const fn of this.hooks) fn(u);
  }
}

// ------------------------------------------------------------------ board layout
const PX = 2000, PY = 1150;
const A = new Panel(0, 0), B = new Panel(PX, 0), C = new Panel(2 * PX, 0);
const D = new Panel(2 * PX, PY), E = new Panel(PX, PY), F = new Panel(0, PY);
const H = new Panel(0, 2 * PY), G = new Panel(PX, 2 * PY), N = new Panel(2 * PX, 2 * PY);
const ctr = p => [p.px + 960, p.py + 540];
function head(p, n, cap, at) {
  p.path(circleP(170, 172, 40), at, .4, { w: 5 });
  p.text(130, 144, n, 'mono', at + .2, { anim: 'pop', w: 80, style: { textAlign: 'center', fontSize: '44px', fontWeight: 700 } });
  p.text(236, 140, cap, 'hand', at + .15, { style: { fontSize: '60px' } });
}
function arrow(from, to, a, b, tA, bend = 40) { // a,b in from/to local coords; world-drawn in from's svg
  const bx = to.px + b[0] - from.px, by = to.py + b[1] - from.py;
  from.path(arrowP(a[0], a[1], bx, by, bend, 30), tA, .7, { w: 7, pen: true });
  CUR.push({ t: tA, x: from.px + a[0], y: from.py + a[1] });
  CUR.push({ t: tA + .75, x: to.px + b[0], y: to.py + b[1] });
}
const cur = (p, t, x, y, click) => CUR.push({ t, x: p.px + x, y: p.py + y, click });
function move(t0, t1, to, dip = 0) { MOVES.push({ t0, t1, to, dip }); }
const hopTo = (i, to, s = 1) => move(NT[i] - .95, NT[i] + .2, [...ctr(to), s], .42);

// ================================================================== 1 · EXPORTER (line 0 and 1)
{
  head(A, '1', 'exporter', .05);
  A.card(130, 250, 520, 300, .2, { pen: true, dur: .9 });
  A.text(160, 272, 'EXPORTER', 'disp', 1.1, { style: { fontSize: '42px' } });
  A.text(160, 330, 'burner wallet', 'hand', 1.4, { style: { fontSize: '32px', color: '#3a3833' } });
  A.text(160, 376, '0x7a3f…c21e', 'mono', 1.6, { style: { fontSize: '28px' } });
  A.live(160, 422, 'mono', { fontSize: '30px', fontWeight: 700 }, 1.8, () => '0.00 AUSD');
  A.button(160, 478, 340, 56, 'Use email wallet', 2.0, { kind: 'ghost', fs: 28 });
  A.text(420, 262, '<span style="position:relative">on Monad<i style="position:absolute;left:-6px;right:-6px;bottom:2px;height:16px;background:#c8ff00;z-index:-1"></i></span>', 'hand', 2.6, { rot: -5, style: { fontSize: '42px', left: '440px', top: '268px' } });

  // calendar doodle: the 90-day wait, crossed out for "now"
  const c0 = T(0, 'waits ninety days'), c1 = T(0, 'to get paid'), c2 = T(0, 'pays them now');
  const out = [NT[1] + 1.2, NT[1] + 1.8];
  A.path(rectP(800, 330, 300, 250, 6), c0 - .2, .5, { w: 5, out });
  A.path(line(800, 395, 1100, 395, 2), c0 + .2, .25, { w: 5, quiet: 1, out });
  A.text(830, 430, '90 days', 'hand', c0 + .3, { style: { fontSize: '56px' }, out });
  A.path(crossP(815, 345, 270).replace(/M/, 'M'), c1 + .1, .45, { w: 9, color: RED, out });
  A.block(860, 640, 230, 30, c2, { out });
  A.text(850, 590, 'now', 'hand', c2, { anim: 'pop', style: { fontSize: '110px' }, out });
  A.path(sparkP(1130, 620, 44), c2 + .3, .3, { w: 5, quiet: 1, out });

  // load demo invoice
  const tLoad = T(0, 'Hisab on Monad', 0);
  const click1 = NT[1] + .55;
  A.button(130, 620, 520, 96, 'Load demo invoice', tLoad, { click: click1, fs: 38 });
  cur(A, tLoad + .8, 1000, 880);
  cur(A, NT[1] + .2, 470, 690);
  cur(A, click1, 440, 676, true);
  // loading bar
  A.bar(130, 760, 520, 44, NT[1] + .3, NT[1] + .75, NT[1] + 2.3);
  A.live(130, 818, 'mono', { fontSize: '28px', fontWeight: 700 }, NT[1] + .75, t => Math.round(100 * eio(seg(t, NT[1] + .75, NT[1] + 2.3))) + '%', { anim: 'op' });
  A.checkBadge(695, 782, 26, NT[1] + 2.35);
  // shipping bill
  const tb = T(1, 'A shipping bill') - .35;
  A.card(720, 250, 520, 440, tb);
  A.text(750, 276, 'Shipping bill', 'hand', tb + .3, { style: { fontSize: '32px', color: '#3a3833' } });

const drift = (st, dt) => { const k = 1 + .0045 * clamp(dt, 0, 9); return { cx: st.cx, cy: st.cy, s: st.s * (st.nodrift ? 1 : k) }; };
function camAt(t) {
  let st = { ...START }, tEnd = 0;
  for (const m of MOVES) {
    if (t < m.t0) return drift(st, t - tEnd);
    const from = drift(st, m.t0 - tEnd);
    if (t < m.t1) {
      const p = eio(seg(t, m.t0, m.t1));
      return { cx: lerp(from.cx, m.to[0], p), cy: lerp(from.cy, m.to[1], p), s: lerp(from.s, m.to[2], p) * (1 - (m.dip || 0) * Math.sin(Math.PI * p)) };
    }
    st = { cx: m.to[0], cy: m.to[1], s: m.to[2], nodrift: m.to[2] < .5 }; tEnd = m.t1;
  }
  return drift(st, t - tEnd);
}

pencil.innerHTML = '<path d="M4 96 L16 66 L70 12 L88 30 L34 84 Z" fill="#c8ff00" stroke="#0a0a0a" stroke-width="5" stroke-linejoin="round"/><path d="M16 66 L34 84" stroke="#0a0a0a" stroke-width="5"/><path d="M70 12 L88 30" stroke="#0a0a0a" stroke-width="9"/><path d="M4 96 L10 80 L20 90 Z" fill="#0a0a0a"/>';

const ripples = CUR.filter(c => c.click).map(c => { const r = document.createElement('div'); r.className = 'ripple'; r.style.left = c.x + 'px'; r.style.top = c.y + 'px'; cam.append(r); return { el: r, t: c.t }; });
function curAt(t) {
  if (!CUR.length || t < CUR[0].t - .4) return null;
  let k = 0; while (k < CUR.length - 1 && CUR[k + 1].t <= t) k++;
  const a = CUR[k], b = CUR[k + 1];
  if (!b) return t > a.t + 6 ? null : { x: a.x, y: a.y };
  const p = eio(seg(t, a.t, b.t));
  const wob = Math.sin(t * 5) * 3;
  return { x: lerp(a.x, b.x, p) + wob * (1 - p), y: lerp(a.y, b.y, p) + Math.cos(t * 4) * 3 * (1 - p) };
}

// ------------------------------------------------------------------ frame
const turb = document.getElementById('turb');
let lastSeed = -1;
function render(t) {
  const c = camAt(t);
  cam.style.transform = `translate(${f1(960 - c.cx * c.s)}px, ${f1(540 - c.cy * c.s)}px) scale(${c.s.toFixed(4)})`;
  const hw = 960 / c.s + 700, hh = 540 / c.s + 700;
  for (const p of panels) {
    const vis = p.px + 1920 > c.cx - hw && p.px < c.cx + hw && p.py + 1080 > c.cy - hh && p.py < c.cy + hh;
    p.el.style.display = vis ? 'block' : 'none';
    p.vis = vis;
    if (vis) p.update(t);
  }
  const seed = 1 + (Math.floor(t * 10) % 6);
  if (seed !== lastSeed) { turb.setAttribute('seed', seed); lastSeed = seed; }
  const cp = curAt(t);
  cursor.style.display = cp ? 'block' : 'none';
  if (cp) cursor.style.transform = `translate(${f1(cp.x)}px, ${f1(cp.y)}px) scale(${Math.max(1, 1 / c.s * .8).toFixed(2)})`;
  for (const r of ripples) { const x = t - r.t; r.el.style.opacity = x > 0 && x < .45 ? 1 - x / .45 : 0; r.el.style.transform = `scale(${(.3 + 1.4 * eo(clamp(x / .45))).toFixed(3)})`; }
  // pencil: latest active pen stroke
  let pen = null;
  for (const e of PEN) if (t >= e.at - .02 && t <= e.at + e.dur + .15 && e.pan.vis && (!pen || e.at > pen.at)) pen = e;
  if (pen) {
    const L = pen.el.getTotalLength(), p = eo(seg(t, pen.at, pen.at + pen.dur));
    const pt = pen.el.getPointAtLength(L * p);
    pencil.style.display = 'block';
    pencil.style.transform = `translate(${f1(pen.pan.px + pt.x - 4)}px, ${f1(pen.pan.py + pt.y - 96)}px) scale(${Math.max(1, 1 / c.s * .7).toFixed(2)})`;
    pencil.style.transformOrigin = '4px 96px';
  } else pencil.style.display = 'none';
}
